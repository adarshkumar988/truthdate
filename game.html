<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6542702247836386"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game - Truth & Dare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background">
    <div class="container">
      <h1>Truth & Dare</h1>
      <h3 id="turn"></h3>
      <button onclick="next()">Next Question</button>
      <p id="question"></p>
    
<div class="adsense">
  <ins class="adsbygoogle"
       style="display:block; text-align:center;"
       data-ad-client="ca-pub-6542702247836386"
       data-ad-slot="1234567890"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

  </div>
  <script src="questions.js"></script>
  <script>
    const category = localStorage.getItem("category");
    let players = localStorage.getItem("players");
    players = players ? JSON.parse(players) : ["You", "Partner"];

    let currentIndex = 0;
    let used = [];

    document.getElementById("turn").textContent = `${players[currentIndex]}'s Turn`;

    function next() {
      if (used.length === questions[category].length) used = [];
      let q;
      do {
        q = questions[category][Math.floor(Math.random() * questions[category].length)];
      } while (used.includes(q));
      used.push(q);
      document.getElementById("question").textContent = q;
      currentIndex = (currentIndex + 1) % players.length;
      document.getElementById("turn").textContent = `${players[currentIndex]}'s Turn`;
    }
  </script>
</body>
</html>
